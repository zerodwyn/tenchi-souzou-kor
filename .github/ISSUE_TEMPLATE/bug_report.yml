name: 버그 제보
description: 천지창조 한글패치에서 발견한 오류를 알려 주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 아래 칸을 채워 주시면 빠르게 확인할 수 있습니다.
        **스크린샷은 "증상" 칸에 이미지를 끌어다 놓거나 Ctrl+V로 붙여넣으면 첨부됩니다.**

  - type: dropdown
    id: version
    attributes:
      label: 패치 버전
      description: 사용 중인 한글패치 버전을 골라 주세요.
      options:
        - v0.93
        - v0.92
        - v0.9
        - 기타 (증상 칸에 적어 주세요)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 구동 환경
      options:
        - 슈퍼패미컴 실기 (플래시카트)
        - MiSTer FPGA
        - 에뮬레이터 (PC)
        - 에뮬레이터 (모바일)
        - 기타
    validations:
      required: true

  - type: input
    id: emulator
    attributes:
      label: 에뮬레이터 / 플래시카트 이름
      description: 예) Mesen, bsnes, Snes9x, RetroArch(코어 이름), FXPak Pro
    validations:
      required: false

  - type: input
    id: location
    attributes:
      label: 발생 위치
      description: 예) 크리스타 마을 장로의 집, 메뉴 방 아이템 화면
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 증상 (스크린샷 첨부)
      description: 어떤 문제가 있었는지 적고, 스크린샷을 끌어다 놓아 주세요.
      placeholder: 예) 장로와 대화하면 대사 일부가 창 밖으로 넘쳐서 나옵니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법 (선택)
      description: 같은 문제를 다시 일으키는 방법을 알고 계시면 적어 주세요.
      placeholder: |
        1. 세이브 불러오기
        2. 장로의 집에 들어가기
        3. 장로에게 말 걸기
    validations:
      required: false
